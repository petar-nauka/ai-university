<script>
(()=>{
"use strict";
/* the view from main#aiu (references/page-format.md); never HTML from values */
const D=document,H=D.documentElement,M=D.getElementById("aiu");
const I18N={
bg:{progress:"Напредък",day:"Ден",week:"Седмица",min:"мин",lesson:"Урок",tasks:"Задачи",sources:"Източници",
answers:"Отговори",answers_note:"Отвори отговорите чак след като си опитал сам.",copy:"Копирай",copied:"Копирано",
prompt_title:"Готов промпт за следващия модул",prompt_intro:"Копирай текста и го дай на ИИ асистента в нова сесия — модулът ще се изгради, докато учиш последния ден.",
prompt_step:"Поискай следващия модул: копирай готовия промпт по-долу и го дай на ИИ асистента",
today:"Днес",prev_day:"Предишен ден",next_day:"Следващ ден",done:"готово",reset:"Изчисти отметките",
reset_confirm:"Изчисти всички отметки?",open:"Отвори",
kinds:{video:"Видео",reading:"Четиво",task:"Задача",lesson:"Урок",other:"Стъпка",prompt:"Следващ модул"},
before:"Преди да гледаш",after:"След като изгледаш",watch:"Гледай в YouTube",watch_from:"Гледай в YouTube от ",stop_at:"Спри на ",
what_to_read:"Какво четеш",open_reading:"Отвори четивото",read_in_lesson:"Прочети в целия урок",all_tasks:"Всички задачи",
close:"Затвори",about:"Как е направен този курс",capstone:"Краен проект",where:"Страницата е на твоя компютър тук:",
bookmark:"Добави я в отметките на браузъра (Ctrl+D, на Mac ⌘+D).",
listen:"Прочети на глас",stop:"Спри",light:"Лек режим",novoice:"Няма глас за този език. Опитай Microsoft Edge.",
check:"Провери отговора ми",check_intro:"Оцени отговора ми по критериите на задачата: кое е покрито и какво липсва. Не ми давай готово решение, само подсказка.",
my_answer:"Моят отговор:",unverified:"Цялото видео, по желание: минутите не са проверени."},
en:{progress:"Progress",day:"Day",week:"Week",min:"min",lesson:"Lesson",tasks:"Tasks",sources:"Sources",
answers:"Answers",answers_note:"Open the answers only after you have tried yourself.",copy:"Copy",copied:"Copied",
prompt_title:"Ready prompt for the next module",prompt_intro:"Copy this text and give it to your AI assistant in a new session; the module gets built while you study the last day.",
prompt_step:"Ask for the next module: copy the ready prompt below and give it to your AI assistant",
today:"Today",prev_day:"Previous day",next_day:"Next day",done:"done",reset:"Clear the check marks",
reset_confirm:"Clear all check marks?",open:"Open",
kinds:{video:"Video",reading:"Reading",task:"Task",lesson:"Lesson",other:"Step",prompt:"Next module"},
before:"Before you watch",after:"After you watch",watch:"Watch on YouTube",watch_from:"Watch on YouTube from ",stop_at:"Stop at ",
what_to_read:"What to read",open_reading:"Open the reading",read_in_lesson:"Read it in the full lesson",all_tasks:"All tasks",
close:"Close",about:"How this course was made",capstone:"Capstone project",where:"This page is on your computer here:",
bookmark:"Bookmark it in your browser (Ctrl+D, on a Mac ⌘+D).",
listen:"Read aloud",stop:"Stop",light:"Light mode",novoice:"No voice for this language. Try Microsoft Edge.",
check:"Check my answer",check_intro:"Assess my answer against the task criteria: what is met and what is missing. Do not give me a ready solution, only a hint.",
my_answer:"My answer:",unverified:"Whole video, optional: its minutes were not checked."}};
let voice=null,talking=null,L=I18N.en,KEY="",state={},banner=null,dlg=null,pbody=null,pkind=null;
const days=[],q=(s,r)=>(r||D).querySelector(s),qa=(s,r)=>[...(r||D).querySelectorAll(s)];
const ga=(e,n)=>e.getAttribute(n),sa=(e,n,v)=>{e.setAttribute(n,v);return e;};
const gd=(e,n)=>ga(e,"data-"+n),cl=(e,...c)=>{e.classList.add(...c);return e;};
const el=(tag,cls,text)=>{const e=D.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const add=(p,...cs)=>{for(const c of cs)if(c!=null)p.append(c);return p;};
const moveKids=(from,to)=>{while(from.firstChild)to.append(from.firstChild);return to;};
const clear=e=>{while(e.firstChild)e.firstChild.remove();};
const icon=n=>{const ns="http://www.w3.org/2000/svg",s=D.createElementNS(ns,"svg");
sa(s,"class","ic");sa(s,"aria-hidden","true");s.append(sa(D.createElementNS(ns,"use"),"href","#i-"+n));return s;};
const web=u=>/^https?:\/\/\S/i.test(u||"");
const copy=e=>{const c=e.cloneNode(true);c.removeAttribute("id");qa("[id]",c).forEach(x=>x.removeAttribute("id"));return c;};
const link=(href,cls,text,away)=>{const a=sa(el("a",cls,text),"href",href);if(away){a.target="_blank";a.rel="noopener";}return a;};
const button=(cls,text)=>{const b=el("button",cls,text);b.type="button";return b;};
const label=(p,text)=>{if(p)p.prepend(el("strong",null,text+":")," ");};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){return {};}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
const show=name=>{const ps=qa("[data-panel]"),t=ps.find(p=>gd(p,"panel")===name);if(!t)return;
ps.forEach(p=>{p.hidden=p!==t;});qa("[data-show]").forEach(b=>b.classList.toggle("active",gd(b,"show")===name));};
const reveal=t=>{const p=t.closest("[data-panel]");if(p&&p.hidden)show(gd(p,"panel"));
setTimeout(()=>t.scrollIntoView({behavior:"smooth",block:"start"}),0);};
const item=(st,key)=>{
let kind=gd(st,"step");if(!L.kinds[kind]||kind==="prompt")kind="other";
const refs=(gd(st,"ref")||"").split(/\s+/).filter(id=>{const t=id&&D.getElementById(id);return t&&!st.contains(t);});
const box=sa(el("input"),"data-item",key);box.type="checkbox";
const row=add(el("div","item k-"+kind),add(el("label","tick"),box,add(el("span","badge"),icon(kind),L.kinds[kind])));
const text=moveKids(st,el("span","text"));row.append(text);
if(refs.length){const r=refs.join(" ");sa(text,"data-pop",r);row.append(sa(button("open",L.open),"data-pop",r));}
return row;};
const promptBox=(pre,key)=>{const box=el("div","prompt");
if(key){const c=sa(el("input"),"data-item",key);c.type="checkbox";
box.append(add(el("label","item k-prompt"),c,add(el("span","badge"),L.kinds.prompt),el("span","text",L.prompt_step)));}
cl(pre,"prompt-text");
return add(box,add(el("p","prompt-title"),icon("prompt"),L.prompt_title),el("p","muted",L.prompt_intro),
add(el("div","prompt-row"),pre,button("copy",L.copy)));};
const panel=(sec,name,title,prose)=>{if(!sec)return null;
cl(sec,"panel");sa(sec,"data-panel",name);if(!sec.id)sec.id=name;sec.hidden=true;
if(prose)sec.append(moveKids(sec,el("div","prose")));
sec.prepend(el("h2",null,title));return sec;};
const mins=sec=>{const m=gd(sec,"minutes");return m&&isFinite(+m)?(+m)+" "+L.min:"";};
const crumbs=(up,box)=>{if(!up)return null;const p=up.parentNode!==box?up.parentNode:add(el("p"),up);cl(p,"crumbs");return p;};
const buildModule=()=>{
KEY="aiu:"+gd(M,"course")+":"+gd(M,"module");state=load();
const side=el("aside","side"),nav=el("div","daylist"),links=el("div","sidelinks"),top=q("header[data-top]",M);
if(top){const up=q("a[data-up]",top),h1=q("h1",top),sub=q("[data-sub]",top);
add(side,crumbs(up,top),h1);
if(sub){sub.className="muted sub";side.append(sub);}top.hidden=true;}
if(gd(M,"mode")==="light")side.append(el("p","lightmode",L.light));
add(side,add(el("div","progress"),add(el("div","bar"),el("i")),el("div","bartext")),nav,links);
const layout=el("div","layout");M.before(layout);add(layout,side,M);cl(M,"main");
const next=q("section[data-next]",M),kind=next&&gd(next,"kind"),pre=kind==="prompt"&&q("pre[data-prompt]",next);
banner=el("div","banner");banner.hidden=true;if(pre)banner.append(promptBox(copy(pre)));
const secs=qa("section[data-day]",M);
secs.forEach((sec,i)=>{
const n=gd(sec,"day")||String(i+1),last=i===secs.length-1,wk=gd(sec,"week"),dt=gd(sec,"date"),m=mins(sec);
const items=qa("[data-step]",sec).map((st,k)=>item(st,gd(st,"id")||"d"+n+"-"+(k+1)));
clear(sec);sec.className="panel day";sa(sec,"data-panel","day-"+n);sec.hidden=true;
const meta=el("span","muted dmeta");if(wk)meta.append(el("span","wk",L.week+" "+wk));if(dt)meta.append(el("span","date",dt));
sec.append(add(el("h2","dhead"),el("span","dname",L.day+" "+n)," ",el("span","today-tag",L.today),el("span","done-tag",L.done)," ",meta,
m?add(el("span","mins"),icon("clock"),m):null));
if(last&&pre){sec.append(promptBox(pre,"d"+n+"-next"));next.hidden=true;}
add(sec,...items);
const prev=days[i-1];
sec.append(add(el("div","daynav"),prev?sa(button(null,"← "+L.prev_day),"data-show","day-"+prev.n):el("span")));
if(last&&next&&kind!=="prompt"){cl(next,"next");if(kind==="pending")cl(next,"muted");
qa("a",next).forEach(a=>cl(a,"button"));sec.append(next);}
const btn=sa(sa(button("daybtn"),"data-show","day-"+n),"data-day",n);
add(btn,el("span","dot",n),add(el("span","dl"),el("span",null,L.day+" "+n),el("small",null,m))," ",el("span","today-tag",L.today),el("span","count"));
nav.append(btn);days.push({n,sec,btn});});
days.forEach((d,i)=>{const nx=days[i+1];if(nx)q(".daynav",d.sec).append(sa(button("primary",L.next_day+" →"),"data-show","day-"+nx.n));});
const lesson=panel(q("section[data-lesson]",M),"lesson",L.lesson,true);
if(lesson)qa(".prose>section[id]",lesson).forEach(s=>cl(s,"ls"));
const tasks=panel(q("section[data-tasks]",M),"tasks",L.tasks,true),ans=q("a[data-answers]",M);
if(tasks&&ans)tasks.append(add(el("p","muted note"),ans," — "+L.answers_note));
if(tasks)qa("article[data-task]",tasks).forEach(checkBox);
const sources=panel(q("section[data-sources]",M),"sources",L.sources,false);
const cap=panel(q("section[data-capstone]",M),"capstone",L.capstone,true);
const about=panel(q("section[data-about]",M),"about",L.about,true);
[[lesson,"lesson",L.lesson],[tasks,"task",L.tasks],[sources,"reading",L.sources],[ans,"answers",L.answers],[cap,"flag",L.capstone],[about,"info",L.about]].forEach(([p,ic,t])=>{
if(p)links.append(add(p===ans?link(ga(ans,"href")):sa(button(null),"data-show",gd(p,"panel")),icon(ic),t));});
const reset=button("reset linkish",L.reset);side.append(reset);
const res=q("section[data-resources]",M);if(res)res.hidden=true;
add(M,banner,...days.map(d=>d.sec),lesson,tasks,sources,cap,about);
const boxes=qa("input[data-item]");
boxes.forEach(b=>{const k=gd(b,"item");b.checked=!!state[k];
b.addEventListener("change",()=>{state[k]=b.checked;boxes.forEach(o=>{if(gd(o,"item")===k)o.checked=b.checked;});save();update();});});
reset.addEventListener("click",()=>{if(confirm(L.reset_confirm)){state={};save();boxes.forEach(x=>{x.checked=false;});update();}});
const today=update(),first=q("[data-panel]",M);
show(today!==null?"day-"+today:first?gd(first,"panel"):"");};
const update=()=>{
const seen={},all=qa("input[data-item]").filter(b=>{const k=gd(b,"item");if(seen[k])return false;return seen[k]=1;});
const done=all.filter(b=>b.checked).length,pct=all.length?Math.round(100*done/all.length):0;let today=null,last=null;
qa(".bar i").forEach(i=>{i.style.width=pct+"%";});
qa(".bartext").forEach(t=>{t.textContent=L.progress+": "+done+" / "+all.length+" ("+pct+"%)";});
days.forEach(d=>{const b=qa("input[data-item]",d.sec),n=b.filter(x=>x.checked).length,complete=b.length>0&&n===b.length;
d.sec.classList.toggle("done",complete);d.btn.classList.toggle("done",complete);q(".count",d.btn).textContent=n+"/"+b.length;
if(!complete&&today===null)today=d.n;last=d;});
days.forEach(d=>d.btn.classList.toggle("today",d.n===today));
if(banner&&banner.firstChild&&last){let before=true,started=false;
days.forEach(d=>qa("input[data-item]",d.sec).forEach(x=>{if(d!==last&&!x.checked)before=false;if(d===last&&x.checked)started=true;}));
banner.hidden=!(before||started);}
return today;};
const closePop=()=>{if(dlg&&dlg.open){if(dlg.close)dlg.close();else dlg.removeAttribute("open");}};
const makeDialog=()=>{dlg=el("dialog");dlg.id="pop";pkind=el("span","pop-kind");pbody=el("div","pop-body");
const x=sa(button("close"),"aria-label",L.close);x.append(icon("close"));
add(dlg,add(el("div","pop-bar"),pkind,x),pbody);D.body.append(dlg);
x.addEventListener("click",closePop);dlg.addEventListener("click",e=>{if(e.target===dlg)closePop();});
dlg.addEventListener("close",()=>clear(pbody));};
const videoPop=t=>{const c=copy(t),un=gd(t,"verified")==="false",from=un?"":gd(t,"from"),to=un?"":gd(t,"to"),url=gd(t,"url");
const before=q("[data-before]",c),after=q("[data-after]",c),meta=q("[data-meta]",c);if(meta)cl(meta,"muted");
label(before,L.before);label(after,L.after);
[...c.childNodes].forEach(k=>{if(k!==before&&k!==after)pbody.append(k);});
if(un)pbody.append(el("p","unverified",L.unverified));
if(from)pbody.append(el("p","muted",from+(to?"–"+to:"")));
if(before)pbody.append(before);
if(web(url)){const p=add(el("p","watch"),link(url,"button",(from?L.watch_from+from:L.watch)+" ↗",true));
if(to)add(p," ",el("span","muted stop",L.stop_at+to));pbody.append(p);}
if(after)pbody.append(after);};
const readingPop=t=>{const c=copy(t),url=gd(t,"url"),meta=q("[data-meta]",c);if(meta)cl(meta,"muted");
label(q("[data-what]",c),L.what_to_read);moveKids(c,pbody);
if(web(url))pbody.append(add(el("p"),link(url,"button",L.open_reading+" ↗",true)));};
const openPop=ids=>{
const ts=ids.map(i=>D.getElementById(i)).filter(Boolean),parts=[];let kind=null;if(!ts.length||!dlg)return;
clear(pbody);clear(pkind);
ts.forEach(t=>{const k=gd(t,"kind");
if(t.hasAttribute("data-task")){kind=kind||"task";add(pbody,add(el("div","prose"),copy(t)),add(el("p"),link("#"+t.id,"button",L.all_tasks+" →")));}
else if(k==="video"){kind=kind||"video";videoPop(t);}
else if(k){kind=kind||"reading";readingPop(t);}
else if(t.closest("[data-lesson]")){kind=kind||"lesson";parts.push(t);}
else{kind=kind||"other";pbody.append(copy(t));}});
if(parts.length){const pr=add(el("div","prose"),...parts.map(copy));add(pbody,voice?listenBtn(pr):null,pr,add(el("p"),link("#"+parts[0].id,"button",L.read_in_lesson+" →")));}
pkind.append(add(el("span","badge k-"+kind),icon(kind),L.kinds[kind]));
try{dlg.showModal();}catch(e){dlg.setAttribute("open","");}
pbody.scrollTop=0;};
const lines=e=>qa("h2,h3,h4,h5,h6,p,li,th,td,blockquote,pre",e).filter(x=>!x.parentElement.closest("li,p,th,td,blockquote")).map(x=>
(x.tagName==="LI"?"- ":"")+(x.textContent.replace(/\s+/g," ").trim())).filter(Boolean).join("\n");
const checkBox=a=>{const c=a.cloneNode(true);qa("details[data-answer]",c).forEach(x=>x.remove());
const pre=el("pre","check-text",L.check_intro+"\n\n"+lines(c)+"\n\n"+L.my_answer+"\n");pre.hidden=true;a.append(add(el("p"),button("check",L.check)),pre);};
const say=(b,src)=>{const S=speechSynthesis,was=talking;S.cancel();if(was){was.textContent=L.listen;talking=null;if(was===b)return;}
const c=src.cloneNode(true);qa("sup,aside,details,button,.where",c).forEach(x=>x.remove());
const parts=c.textContent.replace(/\s+/g," ").match(/[^.!?…]+[.!?…]*\s*/g)||[];
talking=b;b.textContent=L.stop;
parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.voice=voice;u.lang=voice.lang;
if(i===parts.length-1)u.onend=u.onerror=()=>{if(talking===b){b.textContent=L.listen;talking=null;}};S.speak(u);});};
const listenBtn=src=>{const b=button("listen",L.listen);b.onclick=()=>say(b,src);return b;};
const voices=()=>{const lp=q('[data-panel="lesson"]'),S=window.speechSynthesis;if(!lp)return;
const h2=q("h2",lp),pr=q(".prose",lp)||lp,lang=(gd(M,"lang")||"").toLowerCase().split("-")[0];let done=0;
const pick=()=>S.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith(lang));
const go=v=>{if(done)return;done=1;if(v){voice=v;h2.after(listenBtn(pr));}else h2.after(el("p","novoice",L.novoice));};
if(!S||!window.SpeechSynthesisUtterance)return go(null);
const v=pick();if(v)return go(v);
S.addEventListener("voiceschanged",()=>{const w=pick();if(w)go(w);});setTimeout(()=>go(pick()),1000);};
const buildSimple=page=>{cl(M,"wrap");if(page==="answers")cl(M,"answers");
const top=q("header[data-top]",M);
if(top){const w=moveKids(top,el("div","wrap")),up=q("a[data-up]",w);cl(top,"top");top.append(w);M.before(top);
const cr=crumbs(up,w);if(cr)w.prepend(cr);}
[["answers",null],["about",L.about],["capstone",L.capstone]].forEach(([n,t])=>{const s=q("section[data-"+n+"]",M);
if(s){s.append(moveKids(s,el("div","prose")));if(t)s.prepend(el("h2",null,t));}});
if(page==="index")buildIndex();};
const buildIndex=()=>{const arts=qa("article[data-module]",M),ul=el("ul","modules"),sub=q(".top [data-sub]");if(sub)cl(sub,"goal");
if(arts.length){arts[0].before(ul);arts.forEach(a=>{const li=moveKids(a,el("li")),h=gd(a,"href")||"",t=q(".mtitle",li);
if(gd(a,"status")!=="ready")li.className="pending";
else{if(!q("a[href]",li)&&t&&/^[\w.-]+\.html$/.test(h))t.replaceWith(link(h,"mtitle",t.textContent));
KEY="aiu:"+gd(M,"course")+":"+gd(a,"module");const st=load(),n=Object.keys(st).filter(k=>st[k]).length,all=+gd(a,"steps")||0;
if(n){const pct=all?Math.min(100,Math.round(100*n/all)):0,i=el("i");i.style.width=pct+"%";
li.append(add(el("div","progress"),add(el("div","bar"),i),el("div","bartext",L.progress+": "+n+" / "+all+" ("+pct+"%)")));}}
ul.append(li);a.remove();});}
const pre=q("section[data-next] pre[data-prompt]",M);
if(pre){const s=pre.closest("section"),box=promptBox(pre);if(arts.length)ul.after(box);else s.before(box);s.hidden=true;}};
const where=()=>{const s=q("section[data-about]");if(!s||location.protocol!=="file:")return;let p=location.pathname;
try{p=decodeURIComponent(p);}catch(e){}if(/^\/[A-Za-z]:/.test(p))p=p.slice(1).replace(/\//g,"\\");
(q(".prose",s)||s).prepend(add(el("p","where"),el("strong",null,L.where),el("code",null,p),el("span",null,L.bookmark)));};
const copyText=(text,b)=>{const ok=()=>{const old=b.textContent;b.textContent=L.copied;setTimeout(()=>{b.textContent=old;},1500);};
const fallback=()=>{const ta=el("textarea");ta.value=text;D.body.append(ta);ta.select();try{D.execCommand("copy");ok();}catch(e){}ta.remove();};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fallback);else fallback();};
D.addEventListener("click",e=>{const t=e.target;if(!t||!t.closest)return;
const a=t.closest("a"),h=a&&ga(a,"href");if(web(h))return;
const opener=t.closest("[data-pop]");if(opener){e.preventDefault();openPop(gd(opener,"pop").split(/\s+/));return;}
const s=t.closest("[data-show]");if(s){show(gd(s,"show"));scrollTo(0,0);return;}
const c=t.closest(".copy,.check");if(c){const box=c.closest(".check")?c.closest("article"):c.parentNode,pt=box&&q(".prompt-text,.check-text",box);copyText(pt?pt.textContent:"",c);return;}
if(h&&h[0]==="#"&&h.length>1){const target=D.getElementById(h.slice(1));if(!target)return;e.preventDefault();closePop();reveal(target);}});
try{
if(!M)throw new Error("main#aiu is missing");
L=I18N[(gd(M,"lang")||"").split("-")[0].toLowerCase()]||I18N.en;
const page=gd(M,"page");
if(page==="module")buildModule();else buildSimple(page);
makeDialog();
where();
voices();
let h="";try{h=decodeURIComponent(location.hash);}catch(e){}
const m=/^#open=(.+)$/.exec(h);
if(m)openPop(m[1].split(/\s+/));else if(h.length>1){const t=D.getElementById(h.slice(1));if(t)reveal(t);}
H.setAttribute("data-aiu-ready","1");
}catch(err){H.setAttribute("data-aiu-error",String(err&&err.message||err));qa("#aiu [hidden]").forEach(e=>{e.hidden=false;});}
})();
</script>
</body></html>
